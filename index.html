      <p class="sandbox-version" id="sandbox-version">NKH Sandbox · v2</p>
      <script>
        (function () {
          var el = document.getElementById("sandbox-version");
          if (!el) return;
          var host = location.hostname || "";
          var env = /^(localhost|127\.0\.0\.1)$/i.test(host) ? "local" : "web";
          el.textContent = "NKH Sandbox · v2 " + env;
          document.title = "NKH Sandbox v2 " + env;
        })();
      </script>
